name: build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check public tree
        run: ./scripts/check-public-tree.command
      - name: Build apps
        run: ./build-all.command
      - name: Test Bar Control
        run: |
          cd Apps/BarControl
          swift test
