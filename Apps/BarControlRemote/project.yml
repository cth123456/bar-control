name: BarControlRemote

options:
  bundleIdPrefix: com.cth123456
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: G4Q5WT6422
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

targets:
  BarControlRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: ../BarControl/Sources/CodexTouchBarNative/RemoteControlModels.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cth123456.BarControlRemote
        PRODUCT_NAME: BarControlRemote
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: BarControlRemote.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        ENABLE_USER_SCRIPT_SANDBOXING: true
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false

  BarControlCloudProvisioning:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Provisioning/MacProvisioningStub.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.codex.CodexTouchBarNative
        PRODUCT_NAME: Bar Control Provisioning
        INFOPLIST_FILE: Provisioning/MacProvisioningInfo.plist
        CODE_SIGN_ENTITLEMENTS: ../BarControl/BarControl.entitlements
        SKIP_INSTALL: true
    scheme:
      testTargets: []
      gatherCoverageData: false
