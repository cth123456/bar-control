<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><linearGradient id="brand"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient></defs><rect width="1440" height="900" fill="#F5F7FB"/><rect width="224" height="900" fill="#FFF"/><line x1="224" y1="0" x2="224" y2="900" stroke="#E7EAF2"/><g font-family="SF Pro Display,PingFang SC,Helvetica,sans-serif" fill="#17233F"><rect x="24" y="24" width="176" height="56" rx="16" fill="url(#brand)"/><circle cx="54" cy="52" r="15" fill="#FFF"/><path d="M48 52h12M54 46v12" stroke="#5B6CFB" stroke-width="3" stroke-linecap="round"/><text x="80" y="50" fill="#FFF" font-size="18" font-weight="700">AI助手</text><text x="80" y="67" fill="#E8ECFF" font-size="11">本地 AI 中枢</text><circle cx="43" cy="140" r="8" fill="#A8B0C4"/><text x="64" y="145" font-size="14" fill="#667085" font-weight="400">总览</text><circle cx="43" cy="198" r="8" fill="#A8B0C4"/><text x="64" y="203" font-size="14" fill="#667085" font-weight="400">语音助手</text><rect x="18" y="232" width="188" height="48" rx="12" fill="#EEF1FF"/><circle cx="43" cy="256" r="8" fill="#6376FF"/><text x="64" y="261" font-size="14" fill="#17233F" font-weight="700">本地路由</text><circle cx="43" cy="314" r="8" fill="#A8B0C4"/><text x="64" y="319" font-size="14" fill="#667085" font-weight="400">Agent 管理</text><circle cx="43" cy="372" r="8" fill="#A8B0C4"/><text x="64" y="377" font-size="14" fill="#667085" font-weight="400">Jev 档位</text><circle cx="43" cy="430" r="8" fill="#A8B0C4"/><text x="64" y="435" font-size="14" fill="#667085" font-weight="400">设置与状态</text><rect x="24" y="790" width="176" height="74" rx="14" fill="#F7F8FC" stroke="#E7EAF2"/><circle cx="48" cy="817" r="7" fill="#39C98A"/><text x="66" y="821" font-size="12" font-weight="700">系统在线</text><text x="40" y="845" font-size="11" fill="#8B94A8">关闭窗口不会退出 App</text><text x="264" y="62" font-size="26" font-weight="800">供应商详情</text><text x="264" y="88" font-size="13" fill="#7A8499">新增供应商 URL 并拉取模型；选择常用模型进入统一本地模型池。</text><text x="264" y="142" font-size="17" fill="#17233F" font-weight="800">供应商连接</text><text x="264" y="164" font-size="12" fill="#7A8499" font-weight="400">维护连接信息、同步模型目录、查看最近一次连通与延迟。</text><rect x="264" y="184" width="620" height="484" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><text x="290" y="220" font-size="15" fill="#17233F" font-weight="800">连接设置</text><text x="290" y="258" font-size="11" fill="#7A8499" font-weight="400">显示名称</text><rect x="290" y="270" width="568" height="42" rx="8" fill="#F7F8FC" stroke="#E5E8F0"/><text x="306" y="296" font-size="12" fill="#17233F" font-weight="400">Codex Router</text><text x="290" y="334" font-size="11" fill="#7A8499" font-weight="400">Base URL</text><rect x="290" y="346" width="568" height="42" rx="8" fill="#F7F8FC" stroke="#E5E8F0"/><text x="306" y="372" font-size="12" fill="#17233F" font-weight="400">https://api.example.com/v1</text><text x="290" y="410" font-size="11" fill="#7A8499" font-weight="400">API Key</text><rect x="290" y="422" width="568" height="42" rx="8" fill="#F7F8FC" stroke="#E5E8F0"/><text x="306" y="448" font-size="12" fill="#17233F" font-weight="400">••••••••••••••••••••</text><text x="290" y="486" font-size="11" fill="#7A8499" font-weight="400">API 协议</text><rect x="290" y="498" width="274" height="42" rx="8" fill="#F7F8FC" stroke="#E5E8F0"/><text x="306" y="524" font-size="12" fill="#17233F" font-weight="400">OpenAI 兼容 · Responses</text><text x="584" y="486" font-size="11" fill="#7A8499" font-weight="400">超时</text><rect x="584" y="498" width="274" height="42" rx="8" fill="#F7F8FC" stroke="#E5E8F0"/><text x="600" y="524" font-size="12" fill="#17233F" font-weight="400">120 秒</text><rect x="290" y="584" width="148" height="36" rx="9" fill="#FFFFFF" stroke="#E1E5EF"/><text x="306" y="607" font-size="12" fill="#17233F" font-weight="400">测试连接</text><rect x="450" y="584" width="148" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="466" y="607" font-size="12" fill="#FFFFFF" font-weight="700">拉取模型</text><text x="290" y="644" font-size="10" fill="#8B94A8" font-weight="400">API Key 仅存本机；测试只调用 /models，不发生成请求。</text><rect x="910" y="184" width="358" height="484" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><text x="934" y="220" font-size="15" fill="#17233F" font-weight="800">模型目录</text><text x="934" y="242" font-size="11" fill="#7A8499" font-weight="400">选择加入本地模型池的常用模型</text><rect x="930" y="274" width="318" height="38" rx="8" fill="#F7F8FC" stroke="#F7F8FC"/><rect x="944" y="285" width="16" height="16" rx="4" fill="#6376FF" stroke="#6376FF"/><path d="M948 293l4 4 7-8" fill="none" stroke="#FFF" stroke-width="2"/><text x="972" y="298" font-size="11" fill="#17233F" font-weight="400">deepseek-v4-flash</text><rect x="930" y="322" width="318" height="38" rx="8" fill="#F7F8FC" stroke="#F7F8FC"/><rect x="944" y="333" width="16" height="16" rx="4" fill="#6376FF" stroke="#6376FF"/><path d="M948 341l4 4 7-8" fill="none" stroke="#FFF" stroke-width="2"/><text x="972" y="346" font-size="11" fill="#17233F" font-weight="400">deepseek-v4-pro</text><rect x="930" y="370" width="318" height="38" rx="8" fill="#F7F8FC" stroke="#F7F8FC"/><rect x="944" y="381" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#6376FF"/><text x="972" y="394" font-size="11" fill="#17233F" font-weight="400">gpt-6-astra</text><rect x="930" y="418" width="318" height="38" rx="8" fill="#F7F8FC" stroke="#F7F8FC"/><rect x="944" y="429" width="16" height="16" rx="4" fill="#6376FF" stroke="#6376FF"/><path d="M948 437l4 4 7-8" fill="none" stroke="#FFF" stroke-width="2"/><text x="972" y="442" font-size="11" fill="#17233F" font-weight="400">gpt-5.6-sol</text><rect x="930" y="466" width="318" height="38" rx="8" fill="#F7F8FC" stroke="#F7F8FC"/><rect x="944" y="477" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#6376FF"/><text x="972" y="490" font-size="11" fill="#17233F" font-weight="400">claude-opus-5</text><rect x="930" y="514" width="318" height="38" rx="8" fill="#F7F8FC" stroke="#F7F8FC"/><rect x="944" y="525" width="16" height="16" rx="4" fill="#FFFFFF" stroke="#6376FF"/><text x="972" y="538" font-size="11" fill="#17233F" font-weight="400">glm-5.3</text><text x="934" y="592" font-size="11" fill="#6376FF" font-weight="700">已选 3 个模型</text><rect x="934" y="614" width="140" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="950" y="637" font-size="12" fill="#FFFFFF" font-weight="700">添加已选模型</text><rect x="264" y="692" width="1004" height="92" rx="12" fill="#EEF1FF" stroke="#EEF1FF"/><text x="288" y="722" font-size="13" fill="#3C4DB5" font-weight="700">同步规则</text><text x="288" y="748" font-size="12" fill="#3C4DB5" font-weight="400">模型加入模型池后，可分别添加到 Codex、ZCode 等 Agent。更新供应商 URL 或 Key 会同步影响引用该连接的模型。</text></g></svg>