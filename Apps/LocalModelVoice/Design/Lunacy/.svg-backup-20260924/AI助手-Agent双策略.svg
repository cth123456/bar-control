<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><linearGradient id="brand"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient></defs><rect width="1440" height="900" fill="#F5F7FB"/><rect width="224" height="900" fill="#FFF"/><line x1="224" y1="0" x2="224" y2="900" stroke="#E7EAF2"/><g font-family="SF Pro Display,PingFang SC,Helvetica,sans-serif" fill="#17233F"><rect x="24" y="24" width="176" height="56" rx="16" fill="url(#brand)"/><circle cx="54" cy="52" r="15" fill="#FFF"/><path d="M48 52h12M54 46v12" stroke="#5B6CFB" stroke-width="3" stroke-linecap="round"/><text x="80" y="50" fill="#FFF" font-size="18" font-weight="700">AI助手</text><text x="80" y="67" fill="#E8ECFF" font-size="11">本地 AI 中枢</text><circle cx="43" cy="140" r="8" fill="#A8B0C4"/><text x="64" y="145" font-size="14" fill="#667085" font-weight="400">总览</text><circle cx="43" cy="198" r="8" fill="#A8B0C4"/><text x="64" y="203" font-size="14" fill="#667085" font-weight="400">语音助手</text><circle cx="43" cy="256" r="8" fill="#A8B0C4"/><text x="64" y="261" font-size="14" fill="#667085" font-weight="400">本地路由</text><rect x="18" y="290" width="188" height="48" rx="12" fill="#EEF1FF"/><circle cx="43" cy="314" r="8" fill="#6376FF"/><text x="64" y="319" font-size="14" fill="#17233F" font-weight="700">Agent 管理</text><circle cx="43" cy="372" r="8" fill="#A8B0C4"/><text x="64" y="377" font-size="14" fill="#667085" font-weight="400">Jev 档位</text><circle cx="43" cy="430" r="8" fill="#A8B0C4"/><text x="64" y="435" font-size="14" fill="#667085" font-weight="400">设置与状态</text><rect x="24" y="790" width="176" height="74" rx="14" fill="#F7F8FC" stroke="#E7EAF2"/><circle cx="48" cy="817" r="7" fill="#39C98A"/><text x="66" y="821" font-size="12" font-weight="700">系统在线</text><text x="40" y="845" font-size="11" fill="#8B94A8">关闭窗口不会退出 App</text><text x="264" y="62" font-size="26" font-weight="800">Agent 管理</text><text x="264" y="88" font-size="13" fill="#7A8499">按策略管理外部客户端的模型配置；每个 Agent 的变更范围清晰可控。</text><text x="264" y="142" font-size="17" fill="#17233F" font-weight="800">Agent 配置策略</text><text x="264" y="164" font-size="12" fill="#7A8499" font-weight="400">同一组 Agent 可选择只读监测，或由 AI助手 接管路由配置。切换前会备份目标配置。</text><rect x="264" y="184" width="492" height="96" rx="16" fill="#EEF1FF" stroke="#DCE2FF"/><text x="286" y="214" font-size="14" fill="#3C4DB5" font-weight="700">● 读取客户端配置（推荐）</text><text x="286" y="239" font-size="12" fill="#667085" font-weight="400">扫描真实配置，只显示当前模型；不修改客户端文件。</text><text x="286" y="260" font-size="11" fill="#6376FF" font-weight="400">适合先盘点与确认现状</text><rect x="772" y="184" width="496" height="96" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><text x="794" y="214" font-size="14" fill="#17233F" font-weight="700">○ 使用 AI助手 本地路由</text><text x="794" y="239" font-size="12" fill="#667085" font-weight="400">为每个 Agent 生成独立路由配置；应用前展示差异并自动备份。</text><text x="794" y="260" font-size="11" fill="#7A8499" font-weight="400">需确认后才写入配置文件</text><text x="264" y="326" font-size="17" fill="#17233F" font-weight="800">检测到的 Agent</text><text x="264" y="348" font-size="12" fill="#7A8499" font-weight="400">当前模型来自客户端配置文件。加号从本地模型池选模型。</text><rect x="264" y="366" width="1004" height="330" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><rect x="282" y="384" width="968" height="48" rx="10" fill="#F7F8FC" stroke="#F7F8FC"/><text x="300" y="404" font-size="12" fill="#17233F" font-weight="700">Codex</text><text x="470" y="404" font-size="12" fill="#17233F" font-weight="400">deepseek/deepseek-v4.1-flash</text><text x="470" y="422" font-size="10" fill="#8B94A8" font-weight="400">~/.codex/config.toml</text><text x="920" y="412" font-size="11" fill="#39A978" font-weight="700">可编辑</text><rect x="1188" y="393" width="40" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="1204" y="416" font-size="12" fill="#FFFFFF" font-weight="700">＋</text><rect x="282" y="442" width="968" height="48" rx="10" fill="#F7F8FC" stroke="#F7F8FC"/><text x="300" y="462" font-size="12" fill="#17233F" font-weight="700">ZCode</text><text x="470" y="462" font-size="12" fill="#17233F" font-weight="400">GLM-5.3 · Bigmodel</text><text x="470" y="480" font-size="10" fill="#8B94A8" font-weight="400">~/.zcode/v2/config.json</text><text x="920" y="470" font-size="11" fill="#39A978" font-weight="700">可编辑</text><rect x="1188" y="451" width="40" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="1204" y="474" font-size="12" fill="#FFFFFF" font-weight="700">＋</text><rect x="282" y="500" width="968" height="48" rx="10" fill="#F7F8FC" stroke="#F7F8FC"/><text x="300" y="520" font-size="12" fill="#17233F" font-weight="700">Claude Code</text><text x="470" y="520" font-size="12" fill="#17233F" font-weight="400">claude-opus-5</text><text x="470" y="538" font-size="10" fill="#8B94A8" font-weight="400">~/.claude/settings.json</text><text x="920" y="528" font-size="11" fill="#D79033" font-weight="700">只读</text><rect x="1188" y="509" width="40" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="1204" y="532" font-size="12" fill="#FFFFFF" font-weight="700">＋</text><rect x="282" y="558" width="968" height="48" rx="10" fill="#F7F8FC" stroke="#F7F8FC"/><text x="300" y="578" font-size="12" fill="#17233F" font-weight="700">OpenCode</text><text x="470" y="578" font-size="12" fill="#17233F" font-weight="400">尚未配置</text><text x="470" y="596" font-size="10" fill="#8B94A8" font-weight="400">~/.config/opencode/opencode.json</text><text x="920" y="586" font-size="11" fill="#D79033" font-weight="700">只读</text><rect x="1188" y="567" width="40" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="1204" y="590" font-size="12" fill="#FFFFFF" font-weight="700">＋</text><rect x="282" y="616" width="968" height="48" rx="10" fill="#F7F8FC" stroke="#F7F8FC"/><text x="300" y="636" font-size="12" fill="#17233F" font-weight="700">CC Switch / Codex</text><text x="470" y="636" font-size="12" fill="#17233F" font-weight="400">gpt-5.6-sol</text><text x="47