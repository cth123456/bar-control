    <rect x="264" y="776" width="660" height="52" rx="12" fill="#EEF1FF"/><circle cx="292" cy="802" r="8" fill="#6376FF"/><text x="312" y="807" font-size="12" fill="#3C4DB5">关闭窗口不会退出 AI助手；语音入口默认关闭，点击“开始说话”才申请麦克风权限。</text>
