    <rect x="960" y="676" width="308" height="92" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><text x="980" y="703" font-size="13" font-weight="700">Jev 档位模型</text><text x="980" y="725" font-size="11" fill="#7A8499">Luna · Terra · Sol · Astra</text><text x="980" y="749" font-size="12" fill="#6376FF">统一从本地模型池选择 →</text>
