<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><linearGradient id="brand"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#4F8CFF"/></linearGradient></defs><rect width="1440" height="900" fill="#F5F7FB"/><rect width="224" height="900" fill="#FFF"/><line x1="224" y1="0" x2="224" y2="900" stroke="#E7EAF2"/><g font-family="SF Pro Display,PingFang SC,Helvetica,sans-serif" fill="#17233F"><rect x="24" y="24" width="176" height="56" rx="16" fill="url(#brand)"/><circle cx="54" cy="52" r="15" fill="#FFF"/><path d="M48 52h12M54 46v12" stroke="#5B6CFB" stroke-width="3" stroke-linecap="round"/><text x="80" y="50" fill="#FFF" font-size="18" font-weight="700">AI助手</text><text x="80" y="67" fill="#E8ECFF" font-size="11">本地 AI 中枢</text><circle cx="43" cy="140" r="8" fill="#A8B0C4"/><text x="64" y="145" font-size="14" fill="#667085" font-weight="400">总览</text><rect x="18" y="174" width="188" height="48" rx="12" fill="#EEF1FF"/><circle cx="43" cy="198" r="8" fill="#6376FF"/><text x="64" y="203" font-size="14" fill="#17233F" font-weight="700">语音助手</text><circle cx="43" cy="256" r="8" fill="#A8B0C4"/><text x="64" y="261" font-size="14" fill="#667085" font-weight="400">本地路由</text><circle cx="43" cy="314" r="8" fill="#A8B0C4"/><text x="64" y="319" font-size="14" fill="#667085" font-weight="400">Agent 管理</text><circle cx="43" cy="372" r="8" fill="#A8B0C4"/><text x="64" y="377" font-size="14" fill="#667085" font-weight="400">Jev 档位</text><circle cx="43" cy="430" r="8" fill="#A8B0C4"/><text x="64" y="435" font-size="14" fill="#667085" font-weight="400">设置与状态</text><rect x="24" y="790" width="176" height="74" rx="14" fill="#F7F8FC" stroke="#E7EAF2"/><circle cx="48" cy="817" r="7" fill="#39C98A"/><text x="66" y="821" font-size="12" font-weight="700">系统在线</text><text x="40" y="845" font-size="11" fill="#8B94A8">关闭窗口不会退出 App</text><text x="264" y="62" font-size="26" font-weight="800">语音助手</text><text x="264" y="88" font-size="13" fill="#7A8499">在同一个助手中说话或打字；语音按需开启，App 默认待机。</text><text x="264" y="142" font-size="17" fill="#17233F" font-weight="800">语音助手</text><text x="264" y="164" font-size="12" fill="#7A8499" font-weight="400">语音是 AI助手 的一个入口；默认不打开麦克风，也不影响其他页面。</text><rect x="264" y="184" width="1004" height="120" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><text x="292" y="220" font-size="18" fill="#17233F" font-weight="800">待机</text><text x="292" y="246" font-size="12" fill="#667085" font-weight="400">麦克风关闭。点击“开始说话”后才申请权限；也可以直接输入文字。</text><rect x="1040" y="220" width="180" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="1056" y="243" font-size="12" fill="#FFFFFF" font-weight="700">🎙 开始说话</text><rect x="264" y="324" width="1004" height="380" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><text x="288" y="356" font-size="13" fill="#17233F" font-weight="700">对话记录</text><text x="288" y="378" font-size="11" fill="#7A8499" font-weight="400">语音转写仅在本机显示；回答内容和选用线路会留在本次会话中。</text><rect x="288" y="402" width="440" height="90" rx="12" fill="#EEF1FF" stroke="#DCE2FF"/><text x="308" y="430" font-size="11" fill="#6376FF" font-weight="700">你 · 09:41</text><text x="308" y="458" font-size="13" fill="#17233F" font-weight="400">帮我整理一下今天的工作安排。</text><rect x="760" y="514" width="480" height="110" rx="12" fill="#FFFFFF" stroke="#E5E8F0"/><text x="780" y="542" font-size="11" fill="#6376FF" font-weight="700">AI助手 · 09:41</text><text x="780" y="570" font-size="13" fill="#17233F" font-weight="400">好的，我先按优先级整理成三项……</text><text x="780" y="596" font-size="10" fill="#8B94A8" font-weight="400">线路：Codex · deepseek-v4.1-flash</text><rect x="264" y="722" width="1004" height="70" rx="16" fill="#FFFFFF" stroke="#E5E8F0"/><rect x="284" y="740" width="814" height="34" rx="9" fill="#FFFFFF" stroke="#E1E5EF"/><text x="302" y="762" font-size="12" fill="#A0A8B8" font-weight="400">输入问题，按回车发送</text><rect x="1112" y="740" width="136" height="36" rx="9" fill="#6376FF" stroke="#6376FF"/><text x="1128" y="763" font-size="12" fill="#FFFFFF" font-weight="700">发送</text><text x="264" y="826" font-size="11" fill="#8B94A8" font-weight="400">快捷键 ⌘D 开始 / 停止语音    ·    关闭窗口只隐藏 App，⌘Q 才会退出。</text></g></svg>